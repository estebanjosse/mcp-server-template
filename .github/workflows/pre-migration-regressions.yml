name: Pre-migration regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-migration-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Validator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test template validator
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Test stdio validator
        run: python3 -B scripts/validate_stdio.py --self-test

  regressions:
    name: Regression - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [StdioRegressions, TemplateRegressions]
    env:
      MCP_REGRESSION_OUTPUT: ${{ runner.temp }}/pre-migration-regressions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build unchanged stdio host
        if: matrix.suite == 'StdioRegressions'
        run: dotnet build src/McpServer.Template.Host.Stdio --configuration Release --disable-build-servers
      - name: Run real regression tests
        run: python3 -B scripts/integration_tests/test_pre_migration_regressions.py ${{ matrix.suite }} -v
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-migration-${{ matrix.suite }}
          path: ${{ env.MCP_REGRESSION_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14
